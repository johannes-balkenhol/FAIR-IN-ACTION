# =============================================================================
# core_model.yaml  —  FAIR in action, core metadata model
# -----------------------------------------------------------------------------
# THIS FILE NEVER NAMES A PROJECT.  Project specifics live in project.yaml.
#
#   core_model.yaml  +  project.yaml   =   that project's schema
#                                          -> gapsheet, validator, exporter, audit
#
# Every field carries:
#   source: auto     -> filled by extractors/<assay>.py from the data itself
#           project  -> inherited from project.yaml
#           human    -> ONLY these reach the gap-sheet. Keep this list short.
#   tier:   bronze | silver | gold     (what audit.py scores)
#   why:    shown to the human in the gap-sheet. Improves fill quality. Mandatory.
#
# STATUS: v0 STRAWMAN. The ArrayExpress nesting below is inferred, not verified
#         against a real accepted SDRF/IDF. Correct it against PANC E-MTAB-17360.
# =============================================================================

model_version: "0.1.0-draft"

# ---------------------------------------------------------------------------
# Ontology registry. Core bindings are fixed for all projects.
# Projects may ADD (project.yaml: ontology_extensions), never override.
# ---------------------------------------------------------------------------
ontologies:
  NCBITaxon: {name: NCBI Taxonomy,        use: organism}
  UBERON:    {name: Uber-anatomy Ontology, use: tissue / anatomical site}
  CL:        {name: Cell Ontology,         use: cell type}
  EFO:       {name: Experimental Factor Ontology, use: assay, instrument, disease}
  OBI:       {name: Ontology for Biomedical Investigations, use: protocol, assay}
  MONDO:     {name: Mondo Disease Ontology, use: disease}
  PATO:      {name: Phenotype and Trait Ontology, use: qualifiers (sex, age unit)}
  CHEBI:     {name: Chemical Entities of Biological Interest, use: treatment compound}

# ---------------------------------------------------------------------------
# LEVEL 0 — PROJECT
# One per project. Mostly source: project (i.e. read from project.yaml).
# ---------------------------------------------------------------------------
project:
  project_id:        {source: project, type: string,  tier: bronze, why: "Stable internal key. Appears in every filename and every metadata row."}
  title:             {source: project, type: string,  tier: bronze, why: "Human-readable study title. Reused verbatim in the repository submission."}
  description:       {source: project, type: text,    tier: bronze, why: "One paragraph. Becomes the abstract of the public record."}
  consortium:        {source: project, type: string,  tier: bronze, why: "Funder reporting and institutional attribution."}
  funder_grant_id:   {source: project, type: string,  tier: silver, why: "Required by most repositories and by the DFG final report."}
  pis:               {source: project, type: 'list[person]', tier: bronze, why: "Who is accountable for this data in 10 years."}
  contributors:      {source: project, type: 'list[person]', tier: silver, why: "Credit. Without ORCIDs, credit does not survive a name change or a move."}
  data_steward:      {source: project, type: person,  tier: silver, why: "The one person who answers metadata questions. If nobody, nobody does."}
  licence:           {source: project, type: 'enum[MIT, Apache-2.0, CC-BY-4.0, CC0-1.0]', tier: bronze, why: "Data with no licence is legally unreusable, however open it looks."}
  sensitivity:       {source: project, type: 'enum[open, restricted, pseudonymised, identifying]', tier: bronze, why: "Determines whether this may touch the cloud at all (SOP 13)."}
  embargo_until:     {source: project, type: date, required: false, tier: silver, why: "Repositories support embargo. Use it instead of not depositing."}

  # ---- organisms: MULTI-ORGANISM IS CORE, NOT AN EXTENSION -----------------
  # A06 (host + A. fumigatus), A03 (host + bacteria + virus), A04 (organoid +
  # C. difficile) are the same construct. Design it in once.
  organisms:
    source: project
    type: 'list[organism]'
    tier: bronze
    why: "Host-pathogen studies have >1 organism. A single 'organism' field silently loses the pathogen."
    item_schema:
      taxon:  {ontology: NCBITaxon, required: true}
      role:   {type: 'enum[host, pathogen, commensal, symbiont, vector, other]', required: true}
      strain: {type: string, required: false}

  # ---- identifiers: the machine-traversable research object ----------------
  identifiers:
    code_repo_url:   {source: project, type: url,  tier: bronze, why: "Analysis code in public git. Without it the figures cannot be regenerated."}
    code_doi:        {source: auto,    type: doi,  tier: silver, why: "Zenodo mints this automatically on GitHub release. Costs nothing, so there is no excuse."}
    data_accession:  {source: human,   type: string, tier: silver, why: "E-MTAB / GSE / S-BIAD. The only durable pointer to the data itself."}
    paper_doi:       {source: human,   type: doi, required: false, tier: silver, why: "Closes the loop from data back to the claim it supports."}
    cross_linked:    {source: auto,    type: bool, tier: gold,   why: "GOLD. Code DOI -> data accession -> paper DOI, and back. Separate identifiers are silver; a traversable graph is the 'I' in FAIR."}
    orcids_complete: {source: auto,    type: bool, tier: gold,   why: "GOLD. Zenodo defaults to your GitHub username as author. Nobody fixes this. Fix this."}

  deposition_target:
    source: project
    type: "list[enum[ArrayExpress, GEO, BioImage-Archive, PRIDE, Zenodo, ENA]]"
    tier: silver
    why: "Chosen at project start, not at paper submission. It determines the metadata schema you must satisfy."

# ---------------------------------------------------------------------------
# LEVEL 1 — SAMPLE (biological entity)
# The unit of the model. Everything below hangs off sample_id.
# ---------------------------------------------------------------------------
sample:
  sample_id:        {source: human,   type: string, tier: bronze, why: "Your name for this biological sample. Must match the lab book and the filenames."}
  organism_ref:     {source: human,   type: 'ref[project.organisms]', tier: bronze, why: "Which organism(s) are IN this sample. Dual/triple RNA-seq samples reference more than one."}
  tissue:           {source: human,   ontology: UBERON, required: false, tier: silver, why: "Anatomical site. Enables cross-study queries in community databases."}
  cell_type:        {source: human,   ontology: CL, required: false, tier: silver, why: "Sorted population or annotated cluster. 'Alveolar macrophage' = CL:0000583, not free text."}
  cell_line:        {source: project, type: string, required: false, tier: silver, why: "If immortalised, age/sex are 'not applicable' downstream — declare it once here."}
  disease:          {source: project, ontology: MONDO, required: false, tier: silver, why: "Disease context. Free text here is why cross-study search fails."}
  sex:              {source: human,   type: 'enum[male, female, mixed, not applicable, unknown]', tier: silver, why: "Required by ArrayExpress for every sample, including cell lines."}
  age:              {source: human,   type: quantity, required: false, tier: silver, why: "Required by ArrayExpress. 'not applicable' is a valid answer for cell lines."}
  growth_condition: {source: human,   type: string, required: false, tier: silver, why: "2D vs 3D, organoid, matrix. Changes the biology and is invisible in the data."}

  # ---- experimental design: the factors that define the comparison ---------
  factors:
    source: human
    type: 'list[factor]'
    tier: bronze
    why: "The variables you are comparing. If these are wrong, the whole submission describes the wrong experiment."
    item_schema:
      name:  {type: string, required: true}     # e.g. treatment, timepoint, infection
      value: {type: string, required: true}
      unit:  {type: string, required: false}
      ontology: {type: curie, required: false}  # CHEBI for compounds, EFO for time

  infection:
    source: human
    type: 'list[infection_event]'
    required: false
    tier: silver
    why: "Co-infection order and interval are the experiment. A flat 'treatment' string cannot express 'pathogen A at -24h, pathogen B at 0h'."
    item_schema:
      agent_ref: {type: 'ref[project.organisms]', required: true}
      dose:      {type: quantity, required: false}
      route:     {type: string, required: false}
      time_rel_h: {type: number, required: true, why: "Hours relative to the primary challenge (t=0). Negative = prior infection."}

# ---------------------------------------------------------------------------
# LEVEL 2 — EXTRACT (nucleic acid / protein prep from a sample)
# ---------------------------------------------------------------------------
extract:
  extract_id:       {source: human,  type: string, tier: bronze, why: "One sample can yield several extracts. This is where 1:N starts."}
  sample_ref:       {source: human,  type: 'ref[sample.sample_id]', tier: bronze, why: "Parent link. Without it the hierarchy collapses to a flat table."}
  material_type:    {source: project, type: 'enum[total RNA, polyA RNA, DNA, protein, cell]', tier: bronze, why: "Controlled vocabulary. 'RNA' is not an accepted value."}
  extraction_protocol: {source: project, type: text, tier: silver, why: "Referenced by name from the IDF. Write once per project, not once per sample."}

# ---------------------------------------------------------------------------
# LEVEL 3 — LIBRARY
# THE CLASSIC MODELLING TRAP: the library count is NOT the biological sample
# count. Multiplexed (CMO/hashing) designs have N samples -> 1 library.
# Get this wrong and the whole SDRF is wrong. Ask a human. Always.
# ---------------------------------------------------------------------------
library:
  library_id:       {source: human,  type: string, tier: bronze, why: "Sequencing library. May pool several samples — this is where multiplexing is expressed."}
  extract_refs:     {source: human,  type: "list[ref[extract.extract_id]]", tier: bronze, why: "N:1 for multiplexed designs. THE single most common submission error."}
  multiplex_tag:    {source: human,  type: string, required: false, tier: silver, why: "CMO / hashtag / index that maps a sample back out of a pooled library."}
  library_strategy: {source: project, ontology: EFO, tier: bronze, why: "RNA-Seq, ATAC-seq, WGS. Controlled — 'OTHER' is a red flag to curators."}
  library_selection: {source: project, type: string, tier: silver, why: "Oligo-dT, random priming, none. Determines what the reads represent."}
  library_layout:   {source: auto,   type: 'enum[SINGLE, PAIRED]', tier: bronze, why: "Read from the FASTQs. Never ask."}
  library_source:   {source: project, type: string, tier: silver, why: "e.g. transcriptomic single cell."}
  insert_size:      {source: human,  type: number, required: false, tier: silver, why: "Only the sequencing facility knows this. It is never in the data. Ask them once."}
  construction_protocol: {source: project, type: text, tier: silver, why: "10x v3, Smart-seq2, DIA-MS. Named in the IDF, referenced per row in the SDRF."}

# ---------------------------------------------------------------------------
# LEVEL 4 — ASSAY / RUN   (almost entirely source: auto — this is the payoff)
# ---------------------------------------------------------------------------
assay:
  assay_id:         {source: auto, type: string, tier: bronze, why: "Derived from run + library."}
  library_ref:      {source: auto, type: 'ref[library.library_id]', tier: bronze, why: "Parent link."}
  technology_type:  {source: project, ontology: OBI, tier: bronze, why: "sequencing assay / imaging assay / mass spectrometry assay."}
  instrument:       {source: auto, ontology: EFO, tier: bronze, why: "Extractable from FASTQ headers or raw file metadata. Never ask a human."}
  run_date:         {source: human, type: date, required: false, tier: silver, why: "Often only in the facility's records. Batch effects are dated. Get it."}
  read_length:      {source: auto, type: 'list[int]', tier: silver, why: "Read from the data."}
  index_length:     {source: auto, type: 'list[int]', tier: silver, why: "Read from the data."}

# ---------------------------------------------------------------------------
# LEVEL 5 — FILE
# 100% auto. If any of these ever reaches a human, the extractor is broken.
# ---------------------------------------------------------------------------
file:
  file_name:        {source: auto, type: string, tier: bronze, why: "Extracted."}
  file_ref:         {source: auto, type: 'ref[assay.assay_id]', tier: bronze, why: "Parent link."}
  file_type:        {source: auto, type: 'enum[fastq, bam, h5ad, mtx, tiff, mzML, csv]', tier: bronze, why: "Extracted."}
  file_role:        {source: auto, type: 'enum[raw, primary, processed]', tier: bronze, why: "SOP 5 layer. Drives what gets locked, what gets synced, what gets deposited."}
  checksum_md5:     {source: auto, type: md5, tier: bronze, why: "Required by every repository. Also your only proof the file did not rot."}
  size_bytes:       {source: auto, type: int, tier: bronze, why: "Extracted."}

# ---------------------------------------------------------------------------
# Derived, for audit.py — not stored, computed.
# ---------------------------------------------------------------------------
derived:
  n_samples:        {source: auto, why: "Count. Sanity-check against what the PI believes."}
  n_libraries:      {source: auto, why: "If n_libraries != n_samples, the design is multiplexed. Confirm this is intended."}
  completeness:     {source: auto, why: "Fraction of required fields populated, per tier."}
